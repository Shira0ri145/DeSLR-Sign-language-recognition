version: '3.8'

services:
  jupyter:
    build: .
    container_name: jupyter_notebook
    ports:
      - "8888:8888"  # port Jupyter Notebook
    volumes:
      - .:/app  # cennect cd with /app in container
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --allow-root --NotebookApp.token=''
